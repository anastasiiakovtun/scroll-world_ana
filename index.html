<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'Heure Bleue — The Blue Hour</title>
  <meta name="description" content="An immersive journey through the blue hour. A scroll experience for Guerlain's L'Heure Bleue.">
  <link rel="stylesheet" href="/src/style.scss">
</head>
<body>
  
  <div class="scroll-container" data-scroll-world>
    
    <!-- Opening Title -->
    <section class="scene scene--opening">
      <div class="scene__content">
        <h1 class="title title--main">L'Heure Bleue</h1>
        <p class="scroll-hint">Scroll to discover</p>
      </div>
    </section>

    <!-- Video Journey -->
    <div class="video-wrapper">
      <video 
        class="scroll-video" 
        preload="auto"
        muted
        playsinline
        data-scroll-video>
        <source src="/public/video/lheure-bleue-master.mp4" type="video/mp4">
      </video>
      
      <!-- Scene Text Overlays -->
      <div class="scene-text scene-text--1" data-progress="0.05">
        <p class="scene-text__line">The reflection</p>
      </div>
      
      <div class="scene-text scene-text--2" data-progress="0.25">
        <p class="scene-text__line">The blue hour</p>
      </div>
      
      <div class="scene-text scene-text--3" data-progress="0.50">
        <p class="scene-text__line">Inside the flower</p>
      </div>
      
      <div class="scene-text scene-text--4" data-progress="0.90">
        <h2 class="scene-text__product">L'Heure Bleue</h2>
        <p class="scene-text__subtitle">Eau de Parfum</p>
      </div>
    </div>

    <!-- Final Scene -->
    <section class="scene scene--final">
      <div class="scene__content">
        <h2 class="title title--product">L'Heure Bleue</h2>
        <p class="subtitle">Eau de Parfum</p>
        
        <div class="notes">
          <p>Ozonic accord / Iris / Vanilla</p>
        </div>
        
        <footer class="credits">
          <p>Student concept by Anastasiia Kovtun</p>
          <p class="disclaimer">AI-generated visualization. Not affiliated with Guerlain.</p>
        </footer>
      </div>
    </section>

  </div>

  <!-- Reduced Motion Fallback -->
  <noscript>
    <div class="fallback">
      <h1>L'Heure Bleue</h1>
      <p>This experience requires JavaScript and motion support.</p>
    </div>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
